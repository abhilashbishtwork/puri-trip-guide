<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puri Yatra Guide</title>
<meta name="description" content="Day-by-day guide for the Bhubaneswar &amp; Puri trip">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b5266">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puri Yatra">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea;
    --surface:#ffffff;
    --surface-2:#efe6d6;
    --ink:#211c34;
    --ink-soft:#635c78;
    --ink-faint:#8b849c;
    --accent:#d98a2b;
    --accent-ink:#7a4a0f;
    --accent-soft:#f7e4c4;
    --sea:#2b5266;
    --sea-soft:#dfe9ec;
    --good:#3c8a5b;
    --good-soft:#e0f0e5;
    --warn:#c1442e;
    --warn-soft:#f8e2dd;
    --line:rgba(33,28,52,0.13);
    --line-strong:rgba(33,28,52,0.22);
    --shadow:0 1px 2px rgba(33,28,52,0.06),0 8px 24px -12px rgba(33,28,52,0.18);
    --radius:18px;
    font-size:17px;
  }
  :root[data-theme="dark"]{
    --bg:#15131f; --surface:#1e1b2c; --surface-2:#262238; --ink:#f1eee7; --ink-soft:#b6b0c8; --ink-faint:#847d99;
    --accent:#f0a83e; --accent-ink:#2a1b06; --accent-soft:#3a2c14; --sea:#8fc3da; --sea-soft:#22333b;
    --good:#5fbe86; --good-soft:#1d3327; --warn:#e8735a; --warn-soft:#3a231e;
    --line:rgba(241,238,231,0.14); --line-strong:rgba(241,238,231,0.26);
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 28px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45; overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:"Fraunces","IBM Plex Sans",serif; text-wrap:balance; letter-spacing:-0.01em;}
  .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft); color:var(--accent-ink);}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed; inset:0; z-index:100; background:#0b0a10;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    overflow:hidden; transition:opacity .7s ease;
  }
  #splash.hide{opacity:0; pointer-events:none;}
  #splash .stars{position:absolute; inset:0; opacity:.5;
    background-image:radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.5), transparent),
                      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.4), transparent),
                      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.35), transparent),
                      radial-gradient(1.5px 1.5px at 85% 65%, rgba(255,255,255,.4), transparent),
                      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.3), transparent),
                      radial-gradient(1.5px 1.5px at 12% 80%, rgba(255,255,255,.35), transparent);
  }
  .splash-stage{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .diya{
    position:absolute; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle, #fff2c8 0%, #f5b93e 35%, #d9741a 70%, rgba(217,116,26,0) 100%);
    box-shadow:0 0 18px 8px rgba(240,180,60,.55), 0 0 46px 22px rgba(217,116,26,.28);
    animation:flicker 1.6s ease-in-out infinite;
    opacity:1;
  }
  .diya.launch{ animation:launch 1.15s cubic-bezier(.2,.7,.25,1) forwards; }
  @keyframes flicker{
    0%,100%{ transform:scale(1); filter:brightness(1); }
    45%{ transform:scale(1.12) translateY(-1px); filter:brightness(1.12); }
    60%{ transform:scale(0.94); filter:brightness(0.94); }
  }
  @keyframes launch{
    0%{ transform:scale(1); opacity:1; }
    55%{ transform:scale(9); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
  }
  .flash{
    position:absolute; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,244,214,.95), rgba(240,180,60,.35) 45%, rgba(240,180,60,0) 72%);
    opacity:0; pointer-events:none;
  }
  .flash.burst{ animation:burst 1s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes burst{
    0%{ transform:scale(0.3); opacity:0; }
    12%{ opacity:1; }
    100%{ transform:scale(22); opacity:0; }
  }
  .temple-wrap{
    position:relative; width:150px; height:150px; opacity:0; transform:scale(.05);
  }
  .temple-wrap.arrive{ animation:arrive 1.05s cubic-bezier(.18,.75,.22,1) .15s forwards; }
  @keyframes arrive{
    0%{ transform:scale(.05) rotate(-6deg); opacity:0; }
    65%{ transform:scale(1.14) rotate(1deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .temple-wrap img{
    width:100%; height:100%; display:block;
    filter:drop-shadow(0 0 30px rgba(240,180,60,.55)) drop-shadow(0 0 60px rgba(240,180,60,.25));
  }
  .splash-copy{
    position:absolute; bottom:16%; left:0; right:0; text-align:center; padding:0 32px;
    opacity:0; color:#f4ead2;
  }
  .splash-copy.show{ animation:copyFade 1s ease forwards; }
  @keyframes copyFade{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  .splash-copy .eyebrow{ font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:#e0a94f; margin-bottom:10px; font-weight:600;}
  .splash-copy h1{ font-size:32px; margin:0 0 10px; color:#faf4e6;}
  .splash-copy p{ font-size:15.5px; color:#cfc3ac; margin:0; max-width:340px; margin:0 auto; line-height:1.55;}

  .splash-tap{
    position:absolute; bottom:9%; left:0; right:0; text-align:center; color:#cfc3ac; font-size:13.5px;
    letter-spacing:.03em; opacity:.85; animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .splash-topbar{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:20px 20px calc(20px + env(safe-area-inset-top)); z-index:2;}
  .splash-topbar button{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#f4ead2;
    border-radius:100px; padding:7px 13px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  #splash.playing .splash-topbar, #splash.playing .splash-tap{ opacity:0; pointer-events:none; transition:opacity .3s; }

  /* ================= APP SHELL ================= */
  .app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}

  header.top{ position:sticky; top:0; z-index:30; background:var(--sea); color:#fff; padding:14px 18px 0; padding-top:calc(14px + env(safe-area-inset-top)); box-shadow:var(--shadow);}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:10px; overflow:hidden; flex:none; background:var(--accent);}
  .brand-mark img{width:100%; height:100%; display:block;}
  .brand-text .t1{font-family:"Fraunces",serif; font-weight:600; font-size:17px; line-height:1.1;}
  .brand-text .t2{font-size:12px; opacity:0.75; letter-spacing:.02em;}

  .menu-wrap{position:relative;}
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; gap:6px;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.18);}
  .icon-btn:focus-visible, button:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .view-menu{
    position:absolute; top:46px; right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); width:212px; padding:6px; z-index:25;
    opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none; transition:opacity .14s, transform .14s;
  }
  .view-menu.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .view-menu button{
    width:100%; text-align:left; display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:9px;
    border:none; background:none; color:var(--ink); font-size:14.5px; cursor:pointer; font-weight:500;
  }
  .view-menu button:hover{background:var(--surface-2);}
  .view-menu button.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .view-menu .vi{width:20px; text-align:center; flex:none;}
  .menu-backdrop{position:fixed; inset:0; z-index:22; display:none;}
  .menu-backdrop.open{display:block;}

  .progress-strip{display:flex; gap:4px; padding:10px 0 0;}
  .progress-seg{flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,0.18); overflow:hidden; cursor:pointer;}
  .progress-seg .fill{height:100%; border-radius:3px; background:var(--accent); transition:width .25s ease;}
  .progress-seg.complete .fill{background:var(--good);}

  .day-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:none; min-width:74px; text-align:center; cursor:pointer; padding:8px 10px 9px; border-radius:12px 12px 0 0;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-bottom:none; color:rgba(255,255,255,0.82);
  }
  .day-tab .dn{font-family:"Fraunces",serif; font-weight:600; font-size:15px;}
  .day-tab .dd{font-size:10.5px; opacity:0.85; margin-top:1px;}
  .day-tab.active{background:var(--bg); color:var(--ink); border-color:var(--bg);}
  .day-tab.active .dn{color:var(--ink);}

  main{flex:1; padding:18px 18px 40px;}

  .day-head{margin-bottom:16px;}
  .day-head .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600;}
  .day-head h1{font-size:26px; margin:2px 0 4px; color:var(--ink);}

  .pass{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:20px; overflow:hidden;}
  .pass-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 18px; background:var(--surface-2);}
  .pass-route{display:flex; align-items:center; gap:10px;}
  .pass-city{font-family:"Fraunces",serif; font-size:22px; font-weight:600;}
  .pass-arrow{color:var(--accent); font-size:18px;}
  .pass-pnr{text-align:right;}
  .pass-pnr .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .pass-pnr .val{font-size:17px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:2px 8px; border-radius:6px; display:inline-block; margin-top:2px;}
  .pass-strip{display:flex; border-top:1px dashed var(--line-strong); position:relative;}
  .pass-strip::before, .pass-strip::after{content:""; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--bg);}
  .pass-strip::before{left:-9px;} .pass-strip::after{right:-9px;}
  .pass-field{flex:1; padding:12px 18px; text-align:center;}
  .pass-field + .pass-field{border-left:1px dashed var(--line-strong);}
  .pass-field .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .pass-field .val{font-size:19px; font-weight:600; margin-top:2px;}

  .slot{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:16px; overflow:hidden;}
  .slot-head{display:flex; align-items:center; gap:10px; padding:14px 18px;}
  .slot-head .glyph{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;}
  .slot[data-slot="Morning"] .glyph{background:var(--accent-soft); color:var(--accent-ink);}
  .slot[data-slot="Afternoon"] .glyph{background:var(--sea-soft); color:var(--sea);}
  .slot[data-slot="Evening"] .glyph{background:var(--surface-2); color:var(--ink-soft);}
  .slot-head h2{font-size:17px; margin:0; display:flex; align-items:center; gap:8px;}
  .slot-head .where{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .slot-body{padding:0 18px 16px;}
  .slot-now{font-size:10.5px; font-weight:700; color:var(--good); background:var(--good-soft); padding:2px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em;}
  .slot-lock{font-size:10.5px; font-weight:700; color:var(--ink-faint); background:var(--surface-2); padding:2px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em;}

  .todo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .todo li{display:flex; align-items:flex-start; gap:11px; padding:9px 4px; border-radius:10px; cursor:pointer;}
  .todo li:hover{background:var(--surface-2);}
  .todo .box{flex:none; width:24px; height:24px; margin-top:1px; border-radius:7px; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; color:transparent; transition:background .12s, border-color .12s;}
  .todo li.done .box{background:var(--good); border-color:var(--good); color:#fff;}
  .todo li.done span.txt{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--line-strong);}
  .todo span.txt{font-size:15.5px; padding-top:1px;}
  .todo li.locked, .stay-row.locked{cursor:default; opacity:.55;}
  .todo li.locked:hover, .stay-row.locked:hover{background:none;}
  .todo li.locked .box, .stay-row.locked .box{border-style:dashed;}

  .callout{margin-top:12px; padding:11px 13px; border-radius:12px; font-size:14px; display:flex; gap:9px; align-items:flex-start;}
  .callout.tip{background:var(--accent-soft); color:var(--accent-ink);}
  .callout.warn{background:var(--warn-soft); color:var(--warn);}
  .callout .ic{flex:none; margin-top:1px;}

  .maps-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; padding:12px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--sea); font-weight:600; font-size:14.5px; text-decoration:none; cursor:pointer;}
  .maps-btn:hover{background:var(--surface-2);}

  nav.bottom{position:sticky; bottom:0; display:flex; gap:10px; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -8px 24px -16px rgba(0,0,0,0.25);}
  .nav-btn{flex:1; padding:13px; border-radius:13px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-weight:600; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .nav-btn:disabled{opacity:0.35; cursor:default;}
  .nav-btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .info-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .info-card h4{margin:0 0 6px; font-size:15px; display:flex; align-items:center; gap:7px;}
  .info-card p{margin:0; font-size:14px; color:var(--ink-soft);}

  .status-pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em;}
  .status-pill.ok{background:var(--good-soft); color:var(--good);}
  .status-pill.pend{background:var(--warn-soft); color:var(--warn);}
  .status-pill.toggle{border:none; font-family:inherit; cursor:pointer; -webkit-appearance:none; appearance:none;}
  .status-pill.toggle:active{transform:scale(0.96);}
  .travel-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .travel-row:last-child{border-bottom:none;}
  .travel-row .tr-label{font-size:14.5px; font-weight:500;}
  .travel-row .tr-sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}

  .stay-table{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px;}
  .stay-row{display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .stay-row:last-child{border-bottom:none;}
  .stay-row:hover{background:var(--surface-2);}
  .stay-row .box{flex:none; width:22px; height:22px; margin-top:2px; border-radius:6px; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; color:transparent; transition:background .12s, border-color .12s;}
  .stay-row.done .box{background:var(--good); border-color:var(--good); color:#fff;}
  .stay-row .sr-day{flex:none; width:34px; font-family:"Fraunces",serif; font-weight:600; font-size:14px; color:var(--sea); padding-top:1px;}
  .stay-row .sr-body{flex:1; min-width:0;}
  .stay-row .sr-city{font-size:13.5px; font-weight:600;}
  .stay-row .sr-city span{font-weight:400; color:var(--ink-faint); font-size:11.5px;}
  .stay-row .sr-line{font-size:12.5px; color:var(--ink-soft); margin-top:2px; display:flex; gap:5px; align-items:flex-start;}
  .stay-row.done .sr-city, .stay-row.done .sr-line{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--line-strong);}

  /* ================= JOURNEY MAP ================= */
  .map-wrap{
    position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow);
    background:
      radial-gradient(circle at 15% 8%, rgba(217,138,43,.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(43,82,102,.08), transparent 40%),
      var(--surface);
    padding:22px 14px 26px;
  }
  .map-compass{position:absolute; top:14px; right:16px; width:30px; height:30px; opacity:.35;}
  .map-title{text-align:center; margin-bottom:6px;}
  .map-title .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-faint); font-weight:600;}
  .map-title h1{font-size:22px; margin:2px 0 0;}
  .map-svg{display:block; width:100%; height:auto;}
  .map-node{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer; width:120px;}
  .map-node .dot{
    width:44px; height:44px; border-radius:50%; background:var(--surface); border:2.5px solid var(--sea);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--sea);
    box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
  }
  .map-node .dot .dnum{font-family:"Fraunces",serif; font-weight:700; font-size:16px; line-height:1;}
  .map-node .dot .dmon{font-size:8px; font-weight:600; letter-spacing:.04em; opacity:.75; margin-top:1px;}
  .map-node.base .dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .map-node:active .dot{transform:scale(0.92);}
  .map-node.expanded .dot{box-shadow:0 0 0 5px var(--accent-soft), var(--shadow); transform:scale(1.08);}
  .map-node .lbl{margin-top:6px; font-size:11.5px; font-weight:600; text-align:center; line-height:1.25; color:var(--ink);}
  .map-node .sub{font-size:10px; color:var(--ink-faint); text-align:center;}

  .map-hint{padding:14px 16px; border-radius:14px; background:var(--surface-2); color:var(--ink-soft); font-size:13.5px; text-align:center;}
  .map-detail-wrap{margin-bottom:14px;}
  .map-detail{background:var(--surface); border:1px solid var(--line-strong); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow);}
  .map-detail h3{font-size:18px; margin:2px 0 10px;}
  .md-chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:6px 12px; border-radius:100px; background:var(--sea-soft); color:var(--sea); margin:0 6px 8px 0;}
  .md-chip.hotel{background:var(--accent-soft); color:var(--accent-ink);}
  .md-list{list-style:none; margin:10px 0 14px; padding:0; display:flex; flex-direction:column; gap:7px;}

    if (slot === "Morning"){ end.setHours(12,0,0,0); }
    else if (slot === "Afternoon"){ start.setHours(12,0,0,0); end.setHours(17,0,0,0); }
    else { start.setHours(17,0,0,0); end.setHours(23,59,59,999); }
    return {start:start, end:end};
  }
  function slotState(iso, slot){
    var now = new Date();
    var w = slotWindow(iso, slot);
    if (now < w.start) return "future";
    if (now > w.end) return "past";
    return "present";
  }
  // done-state for a checklist item, respecting the real-time rule:
  // past -> auto-done unless explicitly un-ticked; present -> normal manual toggle; future -> never done, locked.
  function itemState(key, iso, slot){
    var st = slotState(iso, slot);
    if (st === "future") return {state:st, done:false, locked:true};
    if (st === "past") return {state:st, done: doneMap[key] !== false, locked:false};
    return {state:st, done: doneMap[key] === true, locked:false};
  }
  function dayState(iso){
    var now = new Date();
    var start = slotWindow(iso, "Morning").start;
    var end = slotWindow(iso, "Evening").end;
    if (now < start) return "future";
    if (now > end) return "past";
    return "present";
  }
  function dayProgress(i){
    var d = TRIP[i], total = 0, done = 0;
    d.slots.forEach(function(s, si){
      s.items.forEach(function(item, ii){
        total++;
        var key = i+"-"+si+"-"+ii;
        if (itemState(key, d.iso, s.slot).done) done++;
      });
    });
    return {done:done, total:total};
  }

  function mapsUrl(stops){
    return "https://www.google.com/maps/dir/" + stops.filter(Boolean).map(encodeURIComponent).join("/");
  }

  /* ---------------- rendering: day strip + view menu state ---------------- */
  function renderProgressStrip(){

      var pct = p.total ? Math.round(p.done/p.total*100) : 0;
      var seg = document.createElement("div");
      seg.className = "progress-seg" + (pct >= 100 ? " complete" : "");
      seg.title = d.day + ": " + p.done + "/" + p.total + " done";
      seg.innerHTML = '<div class="fill" style="width:'+pct+'%"></div>';
      seg.addEventListener("click", function(){ current = i; viewMode = "day"; setActiveMenu(); render(); });
      wrap.appendChild(seg);

  function renderJourneyMap(){
    var n = TRIP.length;
    var svgW = 320, svgH = 900;
    var pts = [];
    for (var i=0;i<n;i++){
      var t = i/(n-1);
      var xNorm = 0.5 + 0.34*Math.sin(t*Math.PI*2.1);
      pts.push({x: xNorm*svgW, y: 40 + t*(svgH-80)});
    }
    var path = "M " + pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" L ");
    var nodesHtml = pts.map(function(p,i){
      var d = TRIP[i];
      var pct = (p.y/svgH*100).toFixed(2);
      var xpct = (p.x/svgW*100).toFixed(2);
      var dp = d.date.split(" ");
      var isActive = mapExpanded === i;
      return '<div class="map-node'+(d.base?" base":"")+(isActive?" expanded":"")+'" style="left:'+xpct+'%; top:'+pct+'%;" data-jump="'+i+'">'
        + '<div class="dot"><span class="dnum">'+dp[1]+'</span><span class="dmon">'+dp[2].toUpperCase()+'</span></div>'
        + '<div class="lbl">'+d.theme.split(",")[0].split(" — ")[0].split(" via")[0]+'</div>'
        + '<div class="sub">'+d.short+'</div></div>';
    }).join("");
    var detailHtml = mapExpanded !== null
      ? renderMapDetail(mapExpanded)
      : '<div class="map-hint">👆 Tap any day below — see what to do, how you get there, and where you sleep that night.</div>';
    return '<div class="map-detail-wrap" id="mapDetailWrap">'+detailHtml+'</div>'
      + '<div class="map-wrap" style="min-height:'+svgH+'px;">'
      + '<div class="map-title"><div class="eyebrow">The full yatra</div><h1>Ten days, two cities</h1></div>'
      + '<svg class="map-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M12 7l2.2 4.8L19 14l-4.8 2.2L12 21l-2.2-4.8L5 14l4.8-2.2z" fill="currentColor" opacity=".3"/></svg>'
      + '<svg class="map-svg" viewBox="0 0 '+svgW+' '+svgH+'" style="position:absolute; top:64px; left:0; height:'+svgH+'px;" preserveAspectRatio="none">'
      + '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.85"/>'
      + '</svg>'
      + '<div style="position:relative; height:'+svgH+'px;">'+nodesHtml+'</div>'
      + '</div>';

  function fetchBudget(){
    budgetLoading = true;
    budgetError = null;
    fetch(BUDGET_API_URL + "?action=budget")
      .then(function(r){ return r.json(); })
      .then(function(data){
        budgetLoading = false;
        if (data.ok){ budgetRows = data.rows; } else { budgetError = data.error || "Unknown error"; }
        if (viewMode === "budget") render(true);
      })
      .catch(function(err){
        budgetLoading = false;
        budgetError = String(err);
        if (viewMode === "budget") render(true);
      });
  }

  function submitBudget(date, expense, details, amount){
    var body = new URLSearchParams();
    body.set("action", "addBudget");
    body.set("date", date);
    body.set("expense", expense);
    body.set("details", details);
    body.set("amount", amount);
    return fetch(BUDGET_API_URL, { method:"POST", body:body })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.ok){ budgetRows = data.rows; }
        return data;
      });
  }

  function renderBudgetView(){
    if (budgetRows === null && !budgetLoading){ fetchBudget(); }
    var html = '<div class="day-head"><div class="eyebrow">Shared with everyone using this app</div><h1>Budget</h1></div>';

    if (budgetLoading && budgetRows === null){
      html += '<div class="map-hint">Loading shared expenses…</div>';
      return html;
    }
    if (budgetError && budgetRows === null){
      html += '<div class="callout warn"><span class="ic">&#9888;</span><span>Could not load expenses: '+esc(budgetError)+'</span></div>';
    }

    var rows = budgetRows || [];
    var grand = 0;
    var byDate = [];
    var dateIndex = {};
    rows.forEach(function(r){
      grand += r.amount;
      if (!(r.date in dateIndex)){ dateIndex[r.date] = byDate.length; byDate.push({date:r.date, items:[], total:0}); }
      var grp = byDate[dateIndex[r.date]];
      grp.items.push(r);
      grp.total += r.amount;
    });

    html += '<div class="info-card"><h4>💰 Total spent so far</h4><p class="budget-grand">₹'+grand.toLocaleString('en-IN')+'</p></div>';

    byDate.forEach(function(grp){
      html += '<div class="budget-day"><div class="budget-day-head"><span>'+esc(grp.date)+'</span><span>₹'+grp.total.toLocaleString('en-IN')+'</span></div>';
      grp.items.forEach(function(it){
        html += '<div class="budget-row"><div><div class="tr-label">'+esc(it.expense)+'</div><div class="tr-sub">'+esc(it.details||"")+'</div></div><div class="budget-amt">₹'+it.amount.toLocaleString('en-IN')+'</div></div>';
      });
      html += '</div>';
    });

    if (!rows.length && !budgetLoading){
      html += '<div class="map-hint">No expenses logged yet — add the first one below.</div>';
    }

    var dateOptions = TRIP.map(function(t){ var parts = t.date.split(" "); return parts.slice(1).join(" "); })
      .map(function(d){ return '<option value="'+esc(d)+'">'+esc(d)+'</option>'; }).join("");
    var expenseOptions = ["Food","Cab","Shopping","Temple","Others"]
      .map(function(e){ return '<option value="'+e+'">'+e+'</option>'; }).join("");

    html += '<div class="info-card"><h4>➕ Add an expense</h4>'
      + '<form id="budgetForm" class="budget-form">'
      +   '<select id="bf-date" required><option value="" disabled selected>Date</option>'+dateOptions+'</select>'
      +   '<select id="bf-expense" required><option value="" disabled selected>Expense</option>'+expenseOptions+'</select>'
      +   '<input type="text" id="bf-details" placeholder="Details">'
      +   '<input type="number" id="bf-amount" placeholder="Amount (₹)" required>'
      +   '<button type="submit" class="budget-submit">Save — updates for everyone</button>'
      +   '<div id="bf-status" class="bf-status"></div>'
      + '</form></div>';

    return html;
  }

  function render(keepScroll){
    renderProgressStrip();
    renderDayStrip();
    var html;
    if (viewMode === "day") html = renderDayView();
    else if (viewMode === "journeyMap") html = renderJourneyMap();
    else if (viewMode === "travel") html = renderTravelView();
    else if (viewMode === "budget") html = renderBudgetView();
    else html = renderStayView();
    document.getElementById("main").innerHTML = html;

    if (viewMode === "day"){
      document.querySelectorAll(".todo li").forEach(function(li){
        li.addEventListener("click", function(){
          if (li.getAttribute("data-locked") === "true") return; // future slot - not yet happened
          var key = li.getAttribute("data-key");
          var iso = li.getAttribute("data-iso");
          var slot = li.getAttribute("data-slot");
          var wasDone = itemState(key, iso, slot).done;
          doneMap[key] = !wasDone;
          li.classList.toggle("done", !wasDone);
          saveDone();
        });
      });
      document.getElementById("prevBtn").disabled = current === 0;
      document.getElementById("nextBtn").textContent = current === TRIP.length - 1 ? "Trip complete" : "Next day →";
      document.getElementById("nextBtn").disabled = current === TRIP.length - 1;
    }
    if (viewMode === "stay"){
      document.querySelectorAll(".stay-row").forEach(function(row){
        row.addEventListener("click", function(){
          if (row.getAttribute("data-locked") === "true") return; // this day hasn't arrived yet
          var key = row.getAttribute("data-key");
          var iso = row.getAttribute("data-iso");
          var st = dayState(iso);
          var wasDone = st === "past" ? doneMap[key] !== false : doneMap[key] === true;
          doneMap[key] = !wasDone;
          row.classList.toggle("done", !wasDone);
          saveDone();
        });
      });
    }
    if (viewMode === "budget"){
      var bForm = document.getElementById("budgetForm");
      if (bForm){
        bForm.addEventListener("submit", function(ev){
          ev.preventDefault();
          var date = document.getElementById("bf-date").value.trim();
          var expense = document.getElementById("bf-expense").value.trim();
          var details = document.getElementById("bf-details").value.trim();
          var amount = document.getElementById("bf-amount").value.trim();
          var status = document.getElementById("bf-status");
          if (!date || !expense || !amount){ status.textContent = "Fill in date, expense and amount."; return; }
          status.textContent = "Saving…";
          submitBudget(date, expense, details, amount).then(function(data){
            if (data.ok){ render(true); }
            else { status.textContent = "Could not save: " + (data.error || "unknown error"); }
          }).catch(function(err){ status.textContent = "Could not save: " + err; });
        });
      }
    }
    if (viewMode === "travel"){
      document.querySelectorAll(".status-pill.toggle").forEach(function(btn){
        btn.addEventListener("click", function(){
          var key = btn.getAttribute("data-key");
          doneMap[key] = !doneMap[key];
          var isDone = !!doneMap[key];
          btn.classList.toggle("ok", isDone);
          btn.classList.toggle("pend", !isDone);
          btn.textContent = isDone ? "✓ Booked" : "Pending";
          saveDone();
        });
      });
    }
    if (viewMode === "journeyMap"){
      document.querySelectorAll(".map-node").forEach(function(el){
        el.addEventListener("click", function(){
          var idx = parseInt(el.getAttribute("data-jump"), 10);
          mapExpanded = (mapExpanded === idx) ? null : idx;
          render();
        });
      });
      var openBtn = document.querySelector(".md-open");
      if (openBtn){
        openBtn.addEventListener("click", function(){
          current = parseInt(openBtn.getAttribute("data-open"), 10);
          viewMode = "day";
          mapExpanded = null;
          setActiveMenu();
          render();
        });
      }
    }
    if (!keepScroll) window.scrollTo(0,0);
  }

  function setActiveMenu(){
    document.querySelectorAll(".view-menu button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-view") === viewMode);
    });
  }

  document.getElementById("prevBtn").addEventListener("click", function(){ if (current > 0){ current--; render(); }});
  document.getElementById("nextBtn").addEventListener("click", function(){ if (current < TRIP.length - 1){ current++; render(); }});

  var menuBtn = document.getElementById("menuBtn");
  var viewMenu = document.getElementById("viewMenu");
  var menuBackdrop = document.getElementById("menuBackdrop");
  function closeMenu(){ viewMenu.classList.remove("open"); menuBackdrop.classList.remove("open"); }
  menuBtn.addEventListener("click", function(){ viewMenu.classList.toggle("open"); menuBackdrop.classList.toggle("open"); });
  menuBackdrop.addEventListener("click", closeMenu);
  document.querySelectorAll(".view-menu button").forEach(function(b){
    b.addEventListener("click", function(){
      viewMode = b.getAttribute("data-view");
      setActiveMenu();
      closeMenu();
      render();
    });
  });

  setActiveMenu();
  render();

  // keep the real-time lock/unlock state fresh if the app is left open across a slot boundary
  setInterval(function(){ render(true); }, 60000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("service-worker.js").catch(function(){}); });
  }

  /* ---------------- background music (shared with splash) ---------------- */
  var bgMusic = document.getElementById("bgMusic");
  bgMusic.volume = 0.32;
  var bgMuteBtn = document.getElementById("bgMuteBtn");
  var bgMuted = false;
  try{ bgMuted = localStorage.getItem("puriYatraMuted") === "1"; }catch(e){}
  var bgStarted = false;

  function updateBgMuteBtn(){ bgMuteBtn.textContent = bgMuted ? "🔇" : "🔊"; }
  updateBgMuteBtn();

  function startBgMusic(){
    bgStarted = true;
    if (bgMuted) return;
    bgMusic.play().catch(function(){});
  }

  function setBgMuted(val){
    bgMuted = val;
    try{ localStorage.setItem("puriYatraMuted", bgMuted ? "1" : "0"); }catch(e){}
    updateBgMuteBtn();
    if (bgMuted){ bgMusic.pause(); }
    else if (bgStarted){ bgMusic.play().catch(function(){}); }
  }

  bgMuteBtn.addEventListener("click", function(){ setBgMuted(!bgMuted); });

  /* ================= SPLASH SEQUENCE + SOUND ================= */
  (function(){
    var splash = document.getElementById("splash");
    var diya = document.getElementById("diya");
    var flash = document.getElementById("flash");
    var templeWrap = document.getElementById("templeWrap");
    var splashCopy = document.getElementById("splashCopy");
    var splashTap = document.getElementById("splashTap");
    var muteBtn = document.getElementById("muteBtn");
    var muteLbl = document.getElementById("muteLbl");
    var skipBtn = document.getElementById("skipBtn");
    var played = false;

    function updateMuteUI(){ muteBtn.firstChild.textContent = bgMuted ? "🔇 " : "🔊 "; muteLbl.textContent = bgMuted ? "Sound off" : "Sound on"; }
    updateMuteUI();

    muteBtn.addEventListener("click", function(e){
      e.stopPropagation();
      setBgMuted(!bgMuted);
      updateMuteUI();
    });

    var ctx = null;
    function getCtx(){
      if (!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      return ctx;
    }

    function playOm(){
      if (bgMuted) return;
      var ac = getCtx(); if (!ac) return;
      var t0 = ac.currentTime;
      var master = ac.createGain();
      master.gain.setValueAtTime(0, t0);
      master.gain.linearRampToValueAtTime(0.16, t0 + 0.6);
      master.gain.linearRampToValueAtTime(0.1, t0 + 1.6);
      master.gain.linearRampToValueAtTime(0, t0 + 2.6);
      master.connect(ac.destination);
      [65.4, 98, 130.8].forEach(function(freq, i){
        var o = ac.createOscillator();
        o.type = "sine";
        o.frequency.value = freq;
        var g = ac.createGain();
        g.gain.value = i === 0 ? 1 : 0.35;
        var lfo = ac.createOscillator();
        lfo.frequency.value = 4.5 + i;
        var lfoGain = ac.createGain();
        lfoGain.gain.value = 2;
        lfo.connect(lfoGain);
        lfoGain.connect(o.frequency);
        o.connect(g); g.connect(master);
        o.start(t0); lfo.start(t0);
        o.stop(t0 + 2.7); lfo.stop(t0 + 2.7);
      });
    }

    function playShankh(){
      if (bgMuted) return;
      var ac = getCtx(); if (!ac) return;
      var t0 = ac.currentTime;
      var dur = 3.0;
      var base = 138; // deep conch-horn pitch

      var master = ac.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(0.55, t0 + 0.45);   // breath building up
      master.gain.setValueAtTime(0.55, t0 + dur - 0.9);
      master.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);  // breath tailing off

      // a little hall space so it feels blown inside a temple, not dry
      var delay = ac.createDelay(1.0);
      delay.delayTime.value = 0.19;
      var feedback = ac.createGain();
      feedback.gain.value = 0.22;
      var dlp = ac.createBiquadFilter();
      dlp.type = "lowpass"; dlp.frequency.value = 1400;
      delay.connect(dlp); dlp.connect(feedback); feedback.connect(delay);
      delay.connect(ac.destination);

      var filter = ac.createBiquadFilter();
      filter.type = "lowpass";
      filter.Q.value = 1.1;
      filter.frequency.setValueAtTime(280, t0);
      filter.frequency.exponentialRampToValueAtTime(1500, t0 + 0.5);   // brightens as breath firms up
      filter.frequency.setValueAtTime(1500, t0 + dur - 0.9);
      filter.frequency.exponentialRampToValueAtTime(450, t0 + dur);    // dulls as breath runs out
      filter.connect(master);
      master.connect(ac.destination);
      master.connect(delay);

      var o1 = ac.createOscillator();
      o1.type = "sawtooth";
      o1.frequency.setValueAtTime(base * 0.9, t0);
      o1.frequency.exponentialRampToValueAtTime(base, t0 + 0.4); // pitch settles as the note steadies
      var g1 = ac.createGain(); g1.gain.value = 0.6;
      o1.connect(g1); g1.connect(filter);

      var o2 = ac.createOscillator();
      o2.type = "triangle";
      o2.frequency.setValueAtTime(base * 2.01, t0);
      var g2 = ac.createGain(); g2.gain.value = 0.28;
      o2.connect(g2); g2.connect(filter);

      // breath noise woven through the tone
      var bufSize = Math.floor(ac.sampleRate * dur);
      var buffer = ac.createBuffer(1, bufSize, ac.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufSize; i++){ data[i] = Math.random() * 2 - 1; }
      var noise = ac.createBufferSource();
      noise.buffer = buffer;
      var nf = ac.createBiquadFilter();
      nf.type = "bandpass"; nf.frequency.value = 850; nf.Q.value = 0.55;
      var ng = ac.createGain();
      ng.gain.value = 0.05;
      noise.connect(nf); nf.connect(ng); ng.connect(filter);

      // organic breath wobble
      var lfo = ac.createOscillator();
      lfo.frequency.value = 3.1;
      var lfoGain = ac.createGain();
      lfoGain.gain.value = 1.3;
      lfo.connect(lfoGain);
      lfoGain.connect(o1.frequency);
      lfoGain.connect(o2.frequency);

      [o1, o2, noise, lfo].forEach(function(n){ n.start(t0); n.stop(t0 + dur + 0.1); });
    }

    function beginJourney(){
      if (played) return;
      played = true;
      splash.classList.add("playing");
      getCtx(); // unlock audio on user gesture
      startBgMusic();
      playOm();
      diya.classList.add("launch");
      setTimeout(function(){ flash.classList.add("burst"); }, 550);
      setTimeout(function(){ templeWrap.classList.add("arrive"); playShankh(); }, 600);
      setTimeout(function(){ splashCopy.classList.add("show"); }, 1500);
      setTimeout(function(){ finish(); }, 4200);
    }

    function finish(){
      splash.classList.add("hide");
      setTimeout(function(){ splash.style.display = "none"; }, 750);
    }

    skipBtn.addEventListener("click", function(e){ e.stopPropagation(); getCtx(); startBgMusic(); finish(); });
    splash.addEventListener("click", function(e){
      if (e.target === muteBtn || e.target === skipBtn || muteBtn.contains(e.target) || skipBtn.contains(e.target)) return;
      beginJourney();
    });
  })();
})();
</script>
