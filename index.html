<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puri Yatra Guide</title>
<meta name="description" content="Day-by-day guide for the Bhubaneswar &amp; Puri trip">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b5266">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puri Yatra">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea;
    --surface:#ffffff;
    --surface-2:#efe6d6;
    --ink:#211c34;
    --ink-soft:#635c78;
    --ink-faint:#8b849c;
    --accent:#d98a2b;
    --accent-ink:#7a4a0f;
    --accent-soft:#f7e4c4;
    --sea:#2b5266;
    --sea-soft:#dfe9ec;
    --good:#3c8a5b;
    --good-soft:#e0f0e5;
    --warn:#c1442e;
    --warn-soft:#f8e2dd;
    --line:rgba(33,28,52,0.13);
    --line-strong:rgba(33,28,52,0.22);
    --shadow:0 1px 2px rgba(33,28,52,0.06),0 8px 24px -12px rgba(33,28,52,0.18);
    --radius:18px;
    font-size:17px;
  }
  :root[data-theme="dark"]{
    --bg:#15131f; --surface:#1e1b2c; --surface-2:#262238; --ink:#f1eee7; --ink-soft:#b6b0c8; --ink-faint:#847d99;
    --accent:#f0a83e; --accent-ink:#2a1b06; --accent-soft:#3a2c14; --sea:#8fc3da; --sea-soft:#22333b;
    --good:#5fbe86; --good-soft:#1d3327; --warn:#e8735a; --warn-soft:#3a231e;
    --line:rgba(241,238,231,0.14); --line-strong:rgba(241,238,231,0.26);
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 28px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45; overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:"Fraunces","IBM Plex Sans",serif; text-wrap:balance; letter-spacing:-0.01em;}
  .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft); color:var(--accent-ink);}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed; inset:0; z-index:100; background:#0b0a10;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    overflow:hidden; transition:opacity .7s ease;
  }
  #splash.hide{opacity:0; pointer-events:none;}
  #splash .stars{position:absolute; inset:0; opacity:.5;
    background-image:radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.5), transparent),
                      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.4), transparent),
                      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.35), transparent),
                      radial-gradient(1.5px 1.5px at 85% 65%, rgba(255,255,255,.4), transparent),
                      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.3), transparent),
                      radial-gradient(1.5px 1.5px at 12% 80%, rgba(255,255,255,.35), transparent);
  }
  .splash-stage{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .diya{
    position:absolute; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle, #fff2c8 0%, #f5b93e 35%, #d9741a 70%, rgba(217,116,26,0) 100%);
    box-shadow:0 0 18px 8px rgba(240,180,60,.55), 0 0 46px 22px rgba(217,116,26,.28);
    animation:flicker 1.6s ease-in-out infinite;
    opacity:1;
  }
  .diya.launch{ animation:launch 1.15s cubic-bezier(.2,.7,.25,1) forwards; }
  @keyframes flicker{
    0%,100%{ transform:scale(1); filter:brightness(1); }
    45%{ transform:scale(1.12) translateY(-1px); filter:brightness(1.12); }
    60%{ transform:scale(0.94); filter:brightness(0.94); }
  }
  @keyframes launch{
    0%{ transform:scale(1); opacity:1; }
    55%{ transform:scale(9); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
  }
  .flash{
    position:absolute; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,244,214,.95), rgba(240,180,60,.35) 45%, rgba(240,180,60,0) 72%);
    opacity:0; pointer-events:none;
  }
  .flash.burst{ animation:burst 1s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes burst{
    0%{ transform:scale(0.3); opacity:0; }
    12%{ opacity:1; }
    100%{ transform:scale(22); opacity:0; }
  }
  .temple-wrap{
    position:relative; width:150px; height:150px; opacity:0; transform:scale(.05);
  }
  .temple-wrap.arrive{ animation:arrive 1.05s cubic-bezier(.18,.75,.22,1) .15s forwards; }
  @keyframes arrive{
    0%{ transform:scale(.05) rotate(-6deg); opacity:0; }
    65%{ transform:scale(1.14) rotate(1deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .temple-wrap img{
    width:100%; height:100%; display:block;
    filter:drop-shadow(0 0 30px rgba(240,180,60,.55)) drop-shadow(0 0 60px rgba(240,180,60,.25));
  }
  .splash-copy{
    position:absolute; bottom:16%; left:0; right:0; text-align:center; padding:0 32px;
    opacity:0; color:#f4ead2;
  }
  .splash-copy.show{ animation:copyFade 1s ease forwards; }
  @keyframes copyFade{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  .splash-copy .eyebrow{ font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:#e0a94f; margin-bottom:10px; font-weight:600;}
  .splash-copy h1{ font-size:32px; margin:0 0 10px; color:#faf4e6;}
  .splash-copy p{ font-size:15.5px; color:#cfc3ac; margin:0; max-width:340px; margin:0 auto; line-height:1.55;}

  .splash-tap{
    position:absolute; bottom:9%; left:0; right:0; text-align:center; color:#cfc3ac; font-size:13.5px;
    letter-spacing:.03em; opacity:.85; animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .splash-topbar{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:20px 20px calc(20px + env(safe-area-inset-top)); z-index:2;}
  .splash-topbar button{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#f4ead2;
    border-radius:100px; padding:7px 13px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  #splash.playing .splash-topbar, #splash.playing .splash-tap{ opacity:0; pointer-events:none; transition:opacity .3s; }

  /* ================= APP SHELL ================= */
  .app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}

  header.top{ position:sticky; top:0; z-index:30; background:var(--sea); color:#fff; padding:14px 18px 0; padding-top:calc(14px + env(safe-area-inset-top)); box-shadow:var(--shadow);}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:10px; overflow:hidden; flex:none; background:var(--accent);}
  .brand-mark img{width:100%; height:100%; display:block;}
  .brand-text .t1{font-family:"Fraunces",serif; font-weight:600; font-size:17px; line-height:1.1;}
  .brand-text .t2{font-size:12px; opacity:0.75; letter-spacing:.02em;}

  .menu-wrap{position:relative;}
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; gap:6px;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.18);}
  .icon-btn:focus-visible, button:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .view-menu{
    position:absolute; top:46px; right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); width:212px; padding:6px; z-index:25;
    opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none; transition:opacity .14s, transform .14s;
  }
  .view-menu.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .view-menu button{
    width:100%; text-align:left; display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:9px;
    border:none; background:none; color:var(--ink); font-size:14.5px; cursor:pointer; font-weight:500;
  }
  .view-menu button:hover{background:var(--surface-2);}
  .view-menu button.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .view-menu .vi{width:20px; text-align:center; flex:none;}
  .menu-backdrop{position:fixed; inset:0; z-index:22; display:none;}
  .menu-backdrop.open{display:block;}

  .day-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:none; min-width:74px; text-align:center; cursor:pointer; padding:8px 10px 9px; border-radius:12px 12px 0 0;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-bottom:none; color:rgba(255,255,255,0.82);
  }
  .day-tab .dn{font-family:"Fraunces",serif; font-weight:600; font-size:15px;}
  .day-tab .dd{font-size:10.5px; opacity:0.85; margin-top:1px;}
  .day-tab.active{background:var(--bg); color:var(--ink); border-color:var(--bg);}
  .day-tab.active .dn{color:var(--ink);}

  main{flex:1; padding:18px 18px 40px;}

  .day-head{margin-bottom:16px;}
  .day-head .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600;}
  .day-head h1{font-size:26px; margin:2px 0 4px; color:var(--ink);}

  .pass{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:20px; overflow:hidden;}
  .pass-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 18px; background:var(--surface-2);}
  .pass-route{display:flex; align-items:center; gap:10px;}
  .pass-city{font-family:"Fraunces",serif; font-size:22px; font-weight:600;}
  .pass-arrow{color:var(--accent); font-size:18px;}
  .pass-pnr{text-align:right;}
  .pass-pnr .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .pass-pnr .val{font-size:17px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:2px 8px; border-radius:6px; display:inline-block; margin-top:2px;}
  .pass-strip{display:flex; border-top:1px dashed var(--line-strong); position:relative;}
  .pass-strip::before, .pass-strip::after{content:""; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--bg);}
  .pass-strip::before{left:-9px;} .pass-strip::after{right:-9px;}
  .pass-field{flex:1; padding:12px 18px; text-align:center;}
  .pass-field + .pass-field{border-left:1px dashed var(--line-strong);}
  .pass-field .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .pass-field .val{font-size:19px; font-weight:600; margin-top:2px;}

  .slot{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:16px; overflow:hidden;}
  .slot-head{display:flex; align-items:center; gap:10px; padding:14px 18px;}
  .slot-head .glyph{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;}
  .slot[data-slot="Morning"] .glyph{background:var(--accent-soft); color:var(--accent-ink);}
  .slot[data-slot="Afternoon"] .glyph{background:var(--sea-soft); color:var(--sea);}
  .slot[data-slot="Evening"] .glyph{background:var(--surface-2); color:var(--ink-soft);}
  .slot-head h2{font-size:17px; margin:0;}
  .slot-head .where{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .slot-body{padding:0 18px 16px;}

  .todo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .todo li{display:flex; align-items:flex-start; gap:11px; padding:9px 4px; border-radius:10px; cursor:pointer;}
  .todo li:hover{background:var(--surface-2);}
  .todo .box{flex:none; width:24px; height:24px; margin-top:1px; border-radius:7px; border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; color:transparent; transition:background .12s, border-color .12s;}
  .todo li.done .box{background:var(--good); border-color:var(--good); color:#fff;}
  .todo li.done span.txt{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--line-strong);}
  .todo span.txt{font-size:15.5px; padding-top:1px;}

  .callout{margin-top:12px; padding:11px 13px; border-radius:12px; font-size:14px; display:flex; gap:9px; align-items:flex-start;}
  .callout.tip{background:var(--accent-soft); color:var(--accent-ink);}
  .callout.warn{background:var(--warn-soft); color:var(--warn);}
  .callout .ic{flex:none; margin-top:1px;}

  .maps-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; padding:12px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--sea); font-weight:600; font-size:14.5px; text-decoration:none; cursor:pointer;}
  .maps-btn:hover{background:var(--surface-2);}

  nav.bottom{position:sticky; bottom:0; display:flex; gap:10px; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -8px 24px -16px rgba(0,0,0,0.25);}
  .nav-btn{flex:1; padding:13px; border-radius:13px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-weight:600; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .nav-btn:disabled{opacity:0.35; cursor:default;}
  .nav-btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .info-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .info-card h4{margin:0 0 6px; font-size:15px; display:flex; align-items:center; gap:7px;}
  .info-card p{margin:0; font-size:14px; color:var(--ink-soft);}

  .status-pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em;}
  .status-pill.ok{background:var(--good-soft); color:var(--good);}
  .status-pill.pend{background:var(--warn-soft); color:var(--warn);}
  .travel-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .travel-row:last-child{border-bottom:none;}
  .travel-row .tr-label{font-size:14.5px; font-weight:500;}
  .travel-row .tr-sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}

  /* ================= JOURNEY MAP ================= */
  .map-wrap{
    position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow);
    background:
      radial-gradient(circle at 15% 8%, rgba(217,138,43,.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(43,82,102,.08), transparent 40%),
      var(--surface);
    padding:22px 14px 26px;
  }
  .map-compass{position:absolute; top:14px; right:16px; width:30px; height:30px; opacity:.35;}
  .map-title{text-align:center; margin-bottom:6px;}
  .map-title .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-faint); font-weight:600;}
  .map-title h1{font-size:22px; margin:2px 0 0;}
  .map-svg{display:block; width:100%; height:auto;}
  .map-node{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer; width:120px;}
  .map-node .dot{
    width:38px; height:38px; border-radius:50%; background:var(--surface); border:2.5px solid var(--sea);
    display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:14px; color:var(--sea);
    box-shadow:var(--shadow);
  }
  .map-node.base .dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .map-node .lbl{margin-top:6px; font-size:11.5px; font-weight:600; text-align:center; line-height:1.25; color:var(--ink);}
  .map-node .sub{font-size:10px; color:var(--ink-faint); text-align:center;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>

<div id="splash">
  <div class="stars"></div>
  <div class="splash-topbar">
    <button id="muteBtn" aria-label="Toggle sound">🔊 <span id="muteLbl">Sound on</span></button>
    <button id="skipBtn" aria-label="Skip intro">Skip →</button>
  </div>
  <div class="splash-stage">
    <div class="flash" id="flash"></div>
    <div class="diya" id="diya"></div>
    <div class="temple-wrap" id="templeWrap"><img src="icons/icon-512.png" alt=""></div>
    <div class="splash-copy" id="splashCopy">
      <div class="eyebrow">Puri &middot; Odisha</div>
      <h1>Welcome to your Yatra</h1>
      <p>The eastern seat of the sacred Char Dham &mdash; Jagannath Puri, the final dham. Your journey begins here.</p>
    </div>
  </div>
  <div class="splash-tap" id="splashTap">Tap anywhere to light the diya</div>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="brand-mark"><img src="icons/icon-192.png" alt=""></div>
        <div class="brand-text">
          <div class="t1">Puri Yatra Guide</div>
          <div class="t2">8&ndash;17 Sep &middot; Bhubaneswar &amp; Puri</div>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" aria-label="Change view">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="view-menu" id="viewMenu">
          <button data-view="day"><span class="vi">📅</span> Day by day</button>
          <button data-view="journeyMap"><span class="vi">🗺️</span> Journey map</button>
          <button data-view="travel"><span class="vi">✈️</span> Travel &amp; tickets</button>
          <button data-view="stay"><span class="vi">🏨</span> Hotels &amp; food</button>
        </div>
      </div>
    </div>
    <div class="day-strip" id="dayStrip"></div>
  </header>

  <main id="main"></main>

  <nav class="bottom" id="bottomNav">
    <button class="nav-btn" id="prevBtn">&larr; Prev day</button>
    <button class="nav-btn primary" id="nextBtn">Next day &rarr;</button>
  </nav>
</div>

<div class="menu-backdrop" id="menuBackdrop"></div>

<script>
(function(){
  "use strict";

  var TRIP = [
    { day:"Day 1", short:"D1", date:"Tue 8 Sep", theme:"Fly in from Bangalore", base:true, flight:{
        from:"BLR", to:"BBI", airline:"Akasa Air QP-1503", depart:"13:35", arrive:"15:45", pnr:"IBUS2K"
      },
      route:["Bengaluru","Kempegowda International Airport","Biju Patnaik International Airport Bhubaneswar"],
      slots:[
        {slot:"Morning", where:"Home, Bengaluru", items:["Relaxed breakfast at home","Head to Bengaluru airport (BLR) for the 13:35 flight"], tip:null, warn:null},
        {slot:"Afternoon", where:"BLR → BBI → hotel", items:["Flight to Bhubaneswar (Akasa QP-1503)","Drive to the Bhubaneswar hotel and check in"], tip:"Grab a window seat — nice aerial shots on descent into Bhubaneswar.", warn:null},
        {slot:"Evening", where:"Bhubaneswar", items:["Settle in, no plans tonight","Optional: short walk at Ekamra Kanan Botanical Garden"], tip:null, warn:"Keep tonight light — it's been a travel day."}
      ]
    },
    { day:"Day 2", short:"D2", date:"Wed 9 Sep", theme:"Full day in Bhubaneswar — no rush", flight:null,
      route:["Bhubaneswar hotel","Rajarani Temple","Mukteshwar Temple","Wildgrass Restaurant","Lingaraj Temple","Dhauli Peace Pagoda"],
      slots:[
        {slot:"Morning", where:"Rajarani &amp; Mukteshwar Temples", items:["Breakfast at the hotel","Rajarani Temple — carved sandstone, usually very few crowds","Mukteshwar Temple — the famous carved arch"], tip:"Best photo spot of the day: Rajarani's carvings in soft morning light.", warn:null},
        {slot:"Afternoon", where:"Wildgrass, Lingaraj, Dhauli", items:["Odia thali lunch at Wildgrass Restaurant","Lingaraj Temple — view from outside","Dhauli Peace Pagoda — flat, easy walk"], tip:"This is a full day here on purpose — take it slow, no need to rush between stops.", warn:"Only Hindus may enter Lingaraj's inner sanctum — outside view only."},
        {slot:"Evening", where:"Bhubaneswar hotel", items:["Relaxed dinner","Early night — travel to Puri tomorrow"], tip:null, warn:null}

    },
    { day:"Day 3", short:"D3", date:"Thu 10 Sep", theme:"On to Puri", base:true, flight:null,
      route:["Bhubaneswar hotel","Puri, Odisha"],
      slots:[
        {slot:"Morning", where:"Bhubaneswar hotel", items:["Relaxed breakfast, no early start needed","Check out of the Bhubaneswar hotel"], tip:null, warn:null},
        {slot:"Afternoon", where:"Drive to Puri (~1.5 hrs)", items:["Drive from Bhubaneswar to Puri","Check in to the Puri hotel"], tip:null, warn:null},
        {slot:"Evening", where:"Puri Beach (Golden Beach)", items:["Sunset walk on Puri Beach"], tip:"The best sunset of the whole trip — have the camera ready.", warn:null}
      ]
    },
    { day:"Day 4", short:"D4", date:"Fri 11 Sep", theme:"Jagannath Temple darshan", flight:null,
      route:["Puri hotel","Jagannath Temple, Puri"],
      slots:[
        {slot:"Morning", where:"Jagannath Temple", items:["Early breakfast","Jagannath Temple darshan — go early to beat the heat and crowds","Walk the outer wall and temple market lanes (Meghanad Pacheri)"], tip:"Photos are fine along Meghanad Pacheri, outside the temple walls.", warn:"No phones or cameras allowed inside the temple — deposit them at the counter outside first."},
        {slot:"Afternoon", where:"Anand Bazar", items:["Mahaprasad lunch at Anand Bazar — 100% vegetarian, cooked in the temple kitchens"], tip:"Film the market itself — one of Puri's most iconic scenes.", warn:"Small vendors mostly take cash."},
        {slot:"Evening", where:"Puri Beach", items:["Relaxed evening on the beach"], tip:null, warn:null}
      ]
    },
    { day:"Day 5", short:"D5", date:"Sat 12 Sep", theme:"Konark Sun Temple, via Balukhand", flight:null,
      route:["Puri hotel","Konark Sun Temple","Chandrabhaga Beach","Balukhand Wildlife Sanctuary","Puri hotel"],
      slots:[
        {slot:"Morning", where:"Konark Sun Temple (35 km, ~1 hr)", items:["Breakfast, then drive to Konark"], tip:"The carved stone wheels are the single best photo of the whole trip.", warn:"Some walking on uneven stone — comfortable shoes help."},
        {slot:"Afternoon", where:"Chandrabhaga Beach &amp; Balukhand", items:["Chandrabhaga Beach — quieter than Puri's","Stop at Balukhand Wildlife Sanctuary on the way back for a short, easy nature walk"], tip:"Look out for blackbuck deer at Balukhand.", warn:"Keep the Balukhand walk short and unhurried — it's a bonus stop, not the main event."},
        {slot:"Evening", where:"Puri hotel", items:["Return to Puri, relaxed dinner"], tip:null, warn:null}

    },
    { day:"Day 6", short:"D6", date:"Sun 13 Sep", theme:"Raghurajpur craft village", flight:null,

        {slot:"Afternoon", where:"Puri town", items:["Local market shopping, or just rest"], tip:null, warn:"Good souvenirs here: Pattachitra paintings, applique work, sea-shell craft."},

    },
    { day:"Day 7", short:"D7", date:"Mon 14 Sep", theme:"Chilika Lake, via Alarnath Temple", flight:null,
      route:["Puri hotel","Satapada, Chilika Lake","Alarnath Temple","Puri hotel"],
      slots:[
        {slot:"Morning", where:"Satapada (~50 km)", items:["Early breakfast, depart for Satapada / Chilika Lake"], tip:null, warn:"A full day out — pack light rain gear, it's still monsoon season."},
        {slot:"Afternoon", where:"Chilika Lake &amp; Alarnath Temple", items:["Irrawaddy dolphin boat safari on Chilika Lake","Stop at the quiet Alarnath Temple on the drive back (8 km from Puri)"], tip:"Dolphin spotting is the highlight — keep the phone charged.", warn:"The boat ride needs a bit of balance — take it slow getting on and off."},

    },
    { day:"Day 8", short:"D8", date:"Tue 15 Sep", theme:"Rest day in Puri", flight:null,
      route:["Puri"],
      slots:[
        {slot:"Morning", where:"Puri", items:["No excursion today — sleep in, relax at the hotel or the beach"], tip:null, warn:null},
        {slot:"Afternoon", where:"Puri", items:["Optional: revisit a favourite spot, or light shopping"], tip:null, warn:"Nothing is booked today on purpose — use it however feels right."},
        {slot:"Evening", where:"Puri Beach", items:["Relaxed evening, maybe a spa or an early dinner"], tip:null, warn:null}
      ]
    },
    { day:"Day 9", short:"D9", date:"Wed 16 Sep", theme:"Back to Bhubaneswar, via Pipili", base:true, flight:null,
      route:["Puri hotel","Pipili craft market","Ekamra Haat, Bhubaneswar","Bhubaneswar hotel"],
      slots:[
        {slot:"Morning", where:"Puri → Pipili → Bhubaneswar", items:["Breakfast, check out of the Puri hotel","Drive to Bhubaneswar (~1.5 hrs)","Stop at Pipili's applique-craft market on the way"], tip:"Pipili's colourful umbrellas and lampshades are a great last photo stop.", warn:null},
        {slot:"Afternoon", where:"Ekamra Haat, Bhubaneswar", items:["Browse Ekamra Haat handicrafts market for last-minute souvenirs"], tip:null, warn:null},
        {slot:"Evening", where:"Bhubaneswar hotel (near BBI)", items:["Check in to the airport-side hotel, relaxed dinner"], tip:null, warn:"This hotel is chosen to be close to BBI airport, for an easy Day 10."}

    },
    { day:"Day 10", short:"D10", date:"Thu 17 Sep", theme:"Fly home to Bangalore", base:true, flight:{
        from:"BBI", to:"BLR", airline:"IndiGo 6E-6536", depart:"14:15", arrive:"16:25", pnr:"RGPI2U"
      },
      route:["Bhubaneswar hotel","Biju Patnaik International Airport Bhubaneswar","Kempegowda International Airport Bengaluru"],
      slots:[
        {slot:"Morning", where:"Bhubaneswar hotel", items:["Relaxed breakfast","Pack at leisure — no early start needed"], tip:null, warn:null},
        {slot:"Afternoon", where:"Hotel → BBI → BLR", items:["Check out by 12:00","Short cab to Biju Patnaik International Airport","Flight home (IndiGo 6E-6536)"], tip:null, warn:null},
        {slot:"Evening", where:"Bengaluru", items:["Home — trip complete"], tip:null, warn:null}
      ]
    }

  var TRAVEL_LEGS = [
    {label:"Flight: Bengaluru → Bhubaneswar", sub:"Akasa Air QP-1503 · 8 Sep · 13:35", status:"ok"},
    {label:"Flight: Bhubaneswar → Bengaluru", sub:"IndiGo 6E-6536 · 17 Sep · 14:15", status:"ok"},
    {label:"Cab: Home → BLR airport", sub:"Day 1 morning", status:"pend"},
    {label:"Cab: BBI airport → hotel", sub:"Day 1 afternoon", status:"pend"},
    {label:"Intercity taxi: Bhubaneswar → Puri", sub:"Day 3, ~1.5 hrs", status:"pend"},
    {label:"Local cab: Puri sightseeing days", sub:"Konark, Raghurajpur, Chilika (Days 5–7)", status:"pend"},
    {label:"Intercity taxi: Puri → Bhubaneswar", sub:"Day 9, via Pipili", status:"pend"},
    {label:"Cab: Hotel → BBI airport", sub:"Day 10, short ride", status:"pend"}
  ];

  var SLOT_GLYPH = {Morning:"☀️", Afternoon:"⛱️", Evening:"🌙"};
  var current = 0;
  var viewMode = "day";
  var doneMap = {};
  try{ doneMap = JSON.parse(localStorage.getItem("puriYatraDone") || "{}"); }catch(e){ doneMap = {}; }
  function saveDone(){ try{ localStorage.setItem("puriYatraDone", JSON.stringify(doneMap)); }catch(e){} }

  function mapsUrl(stops){
    return "https://www.google.com/maps/dir/" + stops.filter(Boolean).map(encodeURIComponent).join("/");
  }

  /* ---------------- rendering: day strip + view menu state ---------------- */
  function renderDayStrip(){
    var strip = document.getElementById("dayStrip");
    strip.style.display = viewMode === "day" ? "flex" : "none";
    document.getElementById("bottomNav").style.display = viewMode === "day" ? "flex" : "none";
    if (viewMode !== "day") return;
    strip.innerHTML = "";
    TRIP.forEach(function(d, i){
      var el = document.createElement("div");
      el.className = "day-tab" + (i === current ? " active" : "");
      el.innerHTML = '<div class="dn">'+d.short+'</div><div class="dd">'+d.date.split(" ").slice(1).join(" ")+'</div>';
      el.addEventListener("click", function(){ current = i; render(); });
      strip.appendChild(el);
    });
  }

  function renderDayView(){
    var d = TRIP[current];
    var html = '<div class="day-head"><div class="eyebrow">'+d.day+' &middot; '+d.date+'</div><h1>'+d.theme+'</h1></div>';
    if (d.flight){
      var f = d.flight;
      html += '<div class="pass"><div class="pass-top">'
        + '<div class="pass-route"><div class="pass-city">'+f.from+'</div><div class="pass-arrow">&#9992;</div><div class="pass-city">'+f.to+'</div></div>'
        + '<div class="pass-pnr"><div class="lbl">PNR</div><div class="val mono">'+f.pnr+'</div></div></div>'
        + '<div style="padding:2px 18px 12px; font-size:13px; color:var(--ink-soft);">'+f.airline+'</div>'
        + '<div class="pass-strip"><div class="pass-field"><div class="lbl">Depart</div><div class="val mono">'+f.depart+'</div></div>'
        + '<div class="pass-field"><div class="lbl">Arrive</div><div class="val mono">'+f.arrive+'</div></div></div></div>';
    }
    d.slots.forEach(function(s, si){
      html += '<section class="slot" data-slot="'+s.slot+'"><div class="slot-head"><div class="glyph">'+SLOT_GLYPH[s.slot]+'</div><div><h2>'+s.slot+'</h2><div class="where">'+s.where+'</div></div></div><div class="slot-body"><ul class="todo">'
        + s.items.map(function(item, ii){
            var key = current+"-"+si+"-"+ii;
            var isDone = !!doneMap[key];
            return '<li class="'+(isDone?"done":"")+'" data-key="'+key+'"><span class="box">&#10003;</span><span class="txt">'+item+'</span></li>';
          }).join("") + '</ul>';
      if (s.tip){ html += '<div class="callout tip"><span class="ic">&#9733;</span><span>'+s.tip+'</span></div>'; }
      if (s.warn){ html += '<div class="callout warn"><span class="ic">&#9888;</span><span>'+s.warn+'</span></div>'; }
      html += '</div></section>';
    });
    html += '<a class="maps-btn" target="_blank" rel="noopener" href="'+mapsUrl(d.route)+'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Open today’s route in Google Maps</a>';
    return html;
  }

  function renderJourneyMap(){
    var n = TRIP.length;
    var svgW = 320, svgH = 900;
    var pts = [];
    for (var i=0;i<n;i++){
      var t = i/(n-1);
      var xNorm = 0.5 + 0.34*Math.sin(t*Math.PI*2.1);
      pts.push({x: xNorm*svgW, y: 40 + t*(svgH-80)});
    }
    var path = "M " + pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" L ");
    var nodesHtml = pts.map(function(p,i){
      var d = TRIP[i];
      var pct = (p.y/svgH*100).toFixed(2);
      var xpct = (p.x/svgW*100).toFixed(2);
      return '<div class="map-node'+(d.base?" base":"")+'" style="left:'+xpct+'%; top:'+pct+'%;" data-jump="'+i+'">'
        + '<div class="dot">'+d.short+'</div>'
        + '<div class="lbl">'+d.theme.split(",")[0].split(" — ")[0].split(" via")[0]+'</div>'
        + '<div class="sub">'+d.date+'</div></div>';
    }).join("");
    return '<div class="map-wrap" style="min-height:'+svgH+'px;">'
      + '<div class="map-title"><div class="eyebrow">The full yatra</div><h1>Ten days, two cities</h1></div>'
      + '<svg class="map-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M12 7l2.2 4.8L19 14l-4.8 2.2L12 21l-2.2-4.8L5 14l4.8-2.2z" fill="currentColor" opacity=".3"/></svg>'
      + '<svg class="map-svg" viewBox="0 0 '+svgW+' '+svgH+'" style="position:absolute; top:64px; left:0; height:calc(100% - 90px);" preserveAspectRatio="none">'
      + '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.85"/>'
      + '</svg>'
      + '<div style="position:relative; height:'+svgH+'px;">'+nodesHtml+'</div>'
      + '</div>';
  }

  function renderTravelView(){
    var rows = TRAVEL_LEGS.map(function(t){
      return '<div class="travel-row"><div><div class="tr-label">'+t.label+'</div><div class="tr-sub">'+t.sub+'</div></div>'
        + '<span class="status-pill '+(t.status==="ok"?"ok":"pend")+'">'+(t.status==="ok"?"Booked":"Pending")+'</span></div>';
    }).join("");
    return '<div class="day-head"><div class="eyebrow">Logistics</div><h1>Travel &amp; tickets</h1></div>'
      + '<div class="info-card"><h4>✈️ Flights &amp; ground transport</h4>' + rows + '</div>'
      + '<div class="info-card"><h4>📋 A note</h4><p>Green means confirmed and booked. Amber means it still needs arranging — mostly local cabs and intercity taxis, which are easiest to book a few days ahead once dates are locked.</p></div>';
  }

  function renderStayView(){
    return '<div class="day-head"><div class="eyebrow">Where you stay</div><h1>Hotels &amp; food</h1></div>'
      + '<div class="info-card"><h4>🏨 Bhubaneswar — nights of 8, 9 &amp; 16 Sep</h4><p>Pick a hotel within ~1–2 km of Biju Patnaik Airport (BBI) so Day 10 is a short cab, not a long one. Compare: <b>Mayfair Lagoon</b>, <b>Hotel Bijaya Palace</b> (closest to BBI), <b>Swosti Premium</b>.</p></div>'
      + '<div class="info-card"><h4>🏨 Puri — nights of 10–16 Sep</h4><p>Look for a sea-facing property on Chakra Tirtha Road, close to both beach and temple. Compare: <b>Mayfair Heritage</b>, <b>Toshali Sands</b>, <b>Hans Coco Palms</b>.</p></div>'
      + '<div class="info-card"><h4>🍽️ Bhubaneswar eating</h4><p><b>Wildgrass Restaurant</b> — garden setting, full Odia thali, best lunch stop on Day 2.</p></div>'
      + '<div class="info-card"><h4>🍽️ Puri eating</h4><p><b>Anand Bazar</b> (inside the temple complex) for Mahaprasad on Day 4 — cash only. For other meals, the eateries along <b>Chakra Tirtha Road</b> are reliable and vegetarian-friendly.</p></div>';
  }

  function render(){
    renderDayStrip();
    var html;
    if (viewMode === "day") html = renderDayView();
    else if (viewMode === "journeyMap") html = renderJourneyMap();
    else if (viewMode === "travel") html = renderTravelView();
    else html = renderStayView();
    document.getElementById("main").innerHTML = html;

    if (viewMode === "day"){
      document.querySelectorAll(".todo li").forEach(function(li){
        li.addEventListener("click", function(){
          var key = li.getAttribute("data-key");
          doneMap[key] = !doneMap[key];
          li.classList.toggle("done", !!doneMap[key]);
          saveDone();
        });
      });
      document.getElementById("prevBtn").disabled = current === 0;
      document.getElementById("nextBtn").textContent = current === TRIP.length - 1 ? "Trip complete" : "Next day →";
      document.getElementById("nextBtn").disabled = current === TRIP.length - 1;
    }
    if (viewMode === "journeyMap"){
      document.querySelectorAll(".map-node").forEach(function(el){
        el.addEventListener("click", function(){
          current = parseInt(el.getAttribute("data-jump"), 10);
          viewMode = "day";
          setActiveMenu();
          render();
          window.scrollTo(0,0);
        });
      });
    }
    window.scrollTo(0,0);
  }

  function setActiveMenu(){
    document.querySelectorAll(".view-menu button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-view") === viewMode);
    });
  }

  document.getElementById("prevBtn").addEventListener("click", function(){ if (current > 0){ current--; render(); }});
  document.getElementById("nextBtn").addEventListener("click", function(){ if (current < TRIP.length - 1){ current++; render(); }});

  var menuBtn = document.getElementById("menuBtn");
  var viewMenu = document.getElementById("viewMenu");
  var menuBackdrop = document.getElementById("menuBackdrop");
  function closeMenu(){ viewMenu.classList.remove("open"); menuBackdrop.classList.remove("open"); }
  menuBtn.addEventListener("click", function(){ viewMenu.classList.toggle("open"); menuBackdrop.classList.toggle("open"); });
  menuBackdrop.addEventListener("click", closeMenu);
  document.querySelectorAll(".view-menu button").forEach(function(b){
    b.addEventListener("click", function(){
      viewMode = b.getAttribute("data-view");
      setActiveMenu();
      closeMenu();
      render();
    });
  });

  setActiveMenu();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("service-worker.js").catch(function(){}); });
  }

  /* ================= SPLASH SEQUENCE + SOUND ================= */
  (function(){
    var splash = document.getElementById("splash");
    var diya = document.getElementById("diya");
    var flash = document.getElementById("flash");
    var templeWrap = document.getElementById("templeWrap");
    var splashCopy = document.getElementById("splashCopy");
    var splashTap = document.getElementById("splashTap");
    var muteBtn = document.getElementById("muteBtn");
    var muteLbl = document.getElementById("muteLbl");
    var skipBtn = document.getElementById("skipBtn");
    var played = false;
    var muted = false;
    try{ muted = localStorage.getItem("puriYatraMuted") === "1"; }catch(e){}
    updateMuteUI();

    function updateMuteUI(){ muteBtn.firstChild.textContent = muted ? "🔇 " : "🔊 "; muteLbl.textContent = muted ? "Sound off" : "Sound on"; }

    muteBtn.addEventListener("click", function(e){
      e.stopPropagation();
      muted = !muted;
      try{ localStorage.setItem("puriYatraMuted", muted ? "1" : "0"); }catch(err){}
      updateMuteUI();
    });

    var ctx = null;
    function getCtx(){
      if (!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      return ctx;
    }

    function playOm(){
      if (muted) return;
      var ac = getCtx(); if (!ac) return;
      var t0 = ac.currentTime;
      var master = ac.createGain();
      master.gain.setValueAtTime(0, t0);
      master.gain.linearRampToValueAtTime(0.16, t0 + 0.6);
      master.gain.linearRampToValueAtTime(0.1, t0 + 1.6);
      master.gain.linearRampToValueAtTime(0, t0 + 2.6);
      master.connect(ac.destination);
      [65.4, 98, 130.8].forEach(function(freq, i){
        var o = ac.createOscillator();
        o.type = "sine";
        o.frequency.value = freq;
        var g = ac.createGain();
        g.gain.value = i === 0 ? 1 : 0.35;
        var lfo = ac.createOscillator();
        lfo.frequency.value = 4.5 + i;
        var lfoGain = ac.createGain();
        lfoGain.gain.value = 2;
        lfo.connect(lfoGain);
        lfoGain.connect(o.frequency);
        o.connect(g); g.connect(master);
        o.start(t0); lfo.start(t0);
        o.stop(t0 + 2.7); lfo.stop(t0 + 2.7);
      });
    }

    function playBell(){
      if (muted) return;
      var ac = getCtx(); if (!ac) return;
      var t0 = ac.currentTime;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
      g.connect(ac.destination);
      [440, 660, 880, 1320].forEach(function(freq, i){
        var o = ac.createOscillator();
        o.type = i === 0 ? "sine" : "sine";
        o.frequency.value = freq;
        var og = ac.createGain();
        og.gain.value = 1 / (i + 1.4);
        o.connect(og); og.connect(g);
        o.start(t0); o.stop(t0 + 2.4);
      });
    }

    function beginJourney(){
      if (played) return;
      played = true;
      splash.classList.add("playing");
      getCtx(); // unlock audio on user gesture
      playOm();
      diya.classList.add("launch");
      setTimeout(function(){ flash.classList.add("burst"); }, 550);
      setTimeout(function(){ templeWrap.classList.add("arrive"); }, 600);
      setTimeout(function(){ playBell(); }, 900);
      setTimeout(function(){ splashCopy.classList.add("show"); }, 1500);
      setTimeout(function(){ finish(); }, 4200);
    }

    function finish(){
      splash.classList.add("hide");
      setTimeout(function(){ splash.style.display = "none"; }, 750);
    }

    skipBtn.addEventListener("click", function(e){ e.stopPropagation(); finish(); });
    splash.addEventListener("click", function(e){
      if (e.target === muteBtn || e.target === skipBtn || muteBtn.contains(e.target) || skipBtn.contains(e.target)) return;
      beginJourney();
    });
  })();
})();
</script>
